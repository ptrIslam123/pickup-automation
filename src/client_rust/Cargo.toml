[package]
name = "leo_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
playwright = { git = "https://github.com/octaltree/playwright-rust", rev = "a672ce7" }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = "0.11"
base64 = "0.21"
scraper = "0.18"
dirs = "5.0"
lazy_static = "1.4"
thiserror = "1.0"
glob = "0.3.1"
fuzzywuzzy = "0.0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
